name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff

      - name: Lint Python Code with Ruff
        run: |
          ruff check dags/

      - name: Lint dbt SQL Models with SQLFluff
        run: |
          sqlfluff lint dbt_nyc_taxi/models/ --dialect databricks --ignore-parsing || true
